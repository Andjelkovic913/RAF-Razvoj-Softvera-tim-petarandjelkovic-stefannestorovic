# ===============================
# App
# ===============================
spring.application.name=studsluzba-server
server.port=8090

# Keep SQL noise down (flip to true while debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.tool.schema=OFF

# Safer default: don?t keep the session open across view rendering
spring.jpa.open-in-view=false

# ===============================
# MySQL Configuration - PERSISTENT DATABASE
# To use MySQL: UNCOMMENT the MySQL block below and COMMENT OUT the H2 block.
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/razvojsoftvera?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connectionInitSql=SET SESSION sql_require_primary_key=0
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ===============================
# H2 (in-memory) Configuration - For Development
# To use H2 instead of MySQL: UNCOMMENT this block and COMMENT OUT the MySQL block above.
# NOTE: H2 is IN-MEMORY - tables disappear when app stops!
# ===============================
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=update


